name: CI/CD

# Pull requests and pushes run the tests and a production build.
# Only a push to main (or a manual run) continues to the deploy job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend tests (local store and DynamoDB simulator)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to AWS
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Learner Lab keys are temporary: refresh these three secrets at the start of every lab session.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS login
        run: aws sts get-caller-identity

      - name: Package and update the Lambda functions
        working-directory: backend
        run: |
          python scripts/build_lambda.py
          aws lambda update-function-code --function-name eventhub-api --zip-file fileb://build/eventhub-lambda.zip
          aws lambda wait function-updated --function-name eventhub-api
          aws lambda update-function-code --function-name eventhub-reminders --zip-file fileb://build/eventhub-lambda.zip
          aws lambda wait function-updated --function-name eventhub-reminders

      - name: Build the frontend for AWS
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Upload the site to S3
        run: aws s3 sync frontend/dist s3://${{ vars.S3_BUCKET }} --delete

      - name: Clear the CloudFront cache
        if: ${{ vars.CLOUDFRONT_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_ID }} --paths "/*"
